# ApoMonitor - Home Assistant Dashboard YAML (Vertikales Stack-Layout - Keine abgeschnittenen Texte)

title: ApoMonitor
views:
  - title: Apotheken-Steuerung
    path: apo_monitor
    icon: mdi:pharmacy
    badges:
      - entity: binary_sensor.apotheken_kommissionierer_ks01_kommissionierer_online
        name: Automat Online
      - entity: sensor.apotheken_kommissionierer_ks01_kommissionierer_status
        name: Status
      - entity: sensor.apotheken_kommissionierer_ks01_aktive_auftrage
        name: Aktive Aufträge

    cards:
      # 🚨 ZUSTAND & EARLY WARNING BANNER (Wird nur bei NotReady/Störung eingeblendet)
      - type: conditional
        conditions:
          - entity: sensor.apotheken_kommissionierer_ks01_kommissionierer_status
            state_not: Ready
        card:
          type: markdown
          content: >
            ### ⚠️ Warnung: Kommissionierer nicht betriebsbereit!
            **Aktueller Status:** {{ states('sensor.apotheken_kommissionierer_ks01_kommissionierer_status') }}
            **Aktive Aufträge in Queue:** {{ states('sensor.apotheken_kommissionierer_ks01_aktive_auftrage') }}
            
            *Bitte Automaten-Anzeige prüfen.*

      # 📊 ABSCHNITT 1: KOMMISSIONIERAUTOMAT PERFORMANCE (WWKS2 - UNTEREINANDER)
      - type: vertical-stack
        cards:
          - type: markdown
            content: "## 🤖 Kommissionierautomat Performance (WWKS2)"

          # Aktive Vorgänge & Status Kacheln
          - type: tile
            entity: sensor.apotheken_kommissionierer_ks01_aktive_auftrage
            name: Aktive Aufträge in Queue
            icon: mdi:tray-full
            color: blue

          - type: tile
            entity: sensor.apotheken_kommissionierer_ks01_kommissionierer_status
            name: Automaten Status
            icon: mdi:robot-industrial
            color: green

          # Auslagerungsdauer Gauge (Volle Breite)
          - type: gauge
            entity: sensor.apotheken_kommissionierer_ks01_auslagerungsdauer_1h
            name: Auslagerungsdauer (1h Rollierender Mittelwert)
            unit: s
            min: 0
            max: 30
            severity:
              green: 0
              yellow: 10
              red: 20

          # Fehlerquote Gauge (Volle Breite)
          - type: gauge
            entity: sensor.apotheken_kommissionierer_ks01_fehlerquote_24h
            name: Fehlerquote 24 Stunden
            unit: "%"
            min: 0
            max: 10
            severity:
              green: 0
              yellow: 1.5
              red: 5.0

          # Tages-Durchsatz Entitäten-Übersicht
          - type: entities
            title: Tages-Durchsatz & Status
            show_header_toggle: false
            entities:
              - entity: sensor.apotheken_kommissionierer_ks01_auslagerungen_heute
                name: Ausgelagerte Packungen Heute
                icon: mdi:package-up
              - entity: sensor.apotheken_kommissionierer_ks01_einlagerungen_heute
                name: Eingelagerte Packungen Heute
                icon: mdi:package-down
              - entity: binary_sensor.apotheken_kommissionierer_ks01_kommissionierer_online
                name: Automaten-Verbindung (Online)

          # Verlaufsgraph
          - type: history-graph
            title: Auslagerungsdauer Verlauf (24h)
            hours_to_show: 24
            entities:
              - entity: sensor.apotheken_kommissionierer_ks01_auslagerungsdauer_1h
                name: Dauer (Sekunden)

      # 📈 ABSCHNITT 2: WARENWIRTSCHAFT & CONTROLLING (ADAS-DWS - UNTEREINANDER)
      - type: vertical-stack
        cards:
          - type: markdown
            content: "## 🏬 Warenwirtschaft & Lagerqualität (ADAS-DWS)"

          - type: glance
            title: Tagesgeschäft WWS
            show_name: true
            show_icon: true
            entities:
              - entity: sensor.apotheken_kommissionierer_ks01_wws_verkaufe_heute
                name: Verkäufe (Bons)
                icon: mdi:receipt
              - entity: sensor.apotheken_kommissionierer_ks01_wws_lagerbestand
                name: Gesamtlagerbestand
                icon: mdi:boxes

          - type: entities
            title: Verfalls- & Altbestand-Analyse
            show_header_toggle: false
            entities:
              - entity: sensor.apotheken_kommissionierer_ks01_verfall_in_90_tagen
                name: Verfall in ≤ 90 Tagen (Artikel)
                icon: mdi:calendar-alert
              - entity: sensor.apotheken_kommissionierer_ks01_wws_verkaufe_heute
                name: Tagesverkäufe Kumuliert
                icon: mdi:cash-register
