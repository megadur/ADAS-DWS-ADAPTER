# ApoMonitor - Home Assistant Dashboard YAML
# Angepasst an die exakten Home Assistant Auto-Discovery Entitäts-Namen

title: ApoMonitor
views:
  - title: Apotheken-Steuerung
    path: apo_monitor
    icon: mdi:pharmacy
    badges:
      - entity: binary_sensor.apotheken_kommissionierer_ks01_kommissionierer_online
        name: Automat Online
      - entity: sensor.apotheken_kommissionierer_ks01_kommissionierer_status
        name: Status
      - entity: sensor.apotheken_kommissionierer_ks01_aktive_auftrage
        name: Aktive Aufträge

    cards:
      # 🚨 ZUSTAND & EARLY WARNING BANNER
      - type: conditional
        conditions:
          - entity: sensor.apotheken_kommissionierer_ks01_kommissionierer_status
            state_not: Ready
        card:
          type: markdown
          content: >
            ### ⚠️ Warnung: Kommissionierer nicht betriebsbereit!
            **Aktueller Status:** {{ states('sensor.apotheken_kommissionierer_ks01_kommissionierer_status') }}
            **Aktive Aufträge in Queue:** {{ states('sensor.apotheken_kommissionierer_ks01_aktive_auftrage') }}
            
            *Bitte Automaten-Anzeige prüfen.*

      # 📊 ABSCHNITT 1: KOMMISSIONIERAUTOMAT (WWKS2 LIVE-TELEMETRIE)
      - type: grid
        title: 🤖 Kommissionierautomat Performance (WWKS2)
        columns: 3
        square: false
        cards:
          # Auslagerungsdauer Gauge
          - type: gauge
            entity: sensor.apotheken_kommissionierer_ks01_auslagerungsdauer_1h
            name: Auslagerungsdauer (1h Ø)
            unit: s
            min: 0
            max: 30
            severity:
              green: 0
              yellow: 10
              red: 20

          # Fehlerquote Gauge
          - type: gauge
            entity: sensor.apotheken_kommissionierer_ks01_fehlerquote_24h
            name: Fehlerquote 24h
            unit: "%"
            min: 0
            max: 10
            severity:
              green: 0
              yellow: 1.5
              red: 5.0

          # Aktive Vorgänge Kachel
          - type: tile
            entity: sensor.apotheken_kommissionierer_ks01_aktive_auftrage
            name: Queue / Aktive Tasks
            icon: mdi:tray-full
            color: blue

      # Auslagerung / Einlagerung Kacheln & Verläufe
      - type: grid
        columns: 2
        square: false
        cards:
          - type: history-graph
            title: Auslagerungsdauer Verlauf (1h Rollierend)
            hours_to_show: 24
            entities:
              - entity: sensor.apotheken_kommissionierer_ks01_auslagerungsdauer_1h
                name: Dauer (s)

          - type: entities
            title: Tages-Durchsatz Automaten
            show_header_toggle: false
            entities:
              - entity: sensor.apotheken_kommissionierer_ks01_auslagerungen_heute
                name: Ausgelagerte Packungen
                icon: mdi:package-up
              - entity: sensor.apotheken_kommissionierer_ks01_einlagerungen_heute
                name: Eingelagerte Packungen
                icon: mdi:package-down
              - entity: binary_sensor.apotheken_kommissionierer_ks01_kommissionierer_online
                name: Automaten-Verbindung

      # 📈 ABSCHNITT 2: WARENWIRTSCHAFT & CONTROLLING (ADAS-DWS)
      - type: grid
        title: 🏬 Warenwirtschaft & Lagerqualität (ADAS-DWS)
        columns: 2
        square: false
        cards:
          - type: glance
            title: Tagesgeschäft WWS
            show_name: true
            show_icon: true
            entities:
              - entity: sensor.apotheken_kommissionierer_ks01_wws_verkaufe_heute
                name: Verkäufe (Bons)
                icon: mdi:receipt
              - entity: sensor.apotheken_kommissionierer_ks01_wws_lagerbestand
                name: Gesamtlagerbestand
                icon: mdi:boxes

          - type: entities
            title: Verfalls- & Altbestand-Analyse
            show_header_toggle: false
            entities:
              - entity: sensor.apotheken_kommissionierer_ks01_verfall_in_90_tagen
                name: Verfall ≤ 90 Tage
                icon: mdi:calendar-alert
              - entity: sensor.apotheken_kommissionierer_ks01_wws_verkaufe_heute
                name: Tagesverkäufe Kumuliert
                icon: mdi:cash-register
